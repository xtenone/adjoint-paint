<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adjoint-paint viewer</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app" class="viz-root">
  <div id="view"></div>
  <aside id="panel">
    <header>
      <select id="case" aria-label="Case"></select>
      <h1 id="title"></h1>
    </header>

    <section class="cycle">
      <div class="row">
        <button id="play" type="button" aria-label="Afspelen">▶</button>
        <input id="slider" type="range" min="1" max="1" step="0.01" value="1" aria-label="Cyclus">
        <output id="cycleLabel"></output>
      </div>
      <p id="stats" class="muted"></p>
    </section>

    <section class="paint">
      <div class="seg" role="radiogroup" aria-label="Gereedschap">
        <button type="button" data-tool="view" class="on">Bekijken</button>
        <button type="button" data-tool="allowed">Toegestaan</button>
        <button type="button" data-tool="priority">Voorkeur</button>
      </div>
      <p id="toolHelp" class="muted"></p>
      <div id="brush" hidden>
        <label class="check"><input id="erase" type="checkbox"> Gum <span class="muted">(of Shift ingedrukt)</span></label>
        <label class="slider">Grootte <input id="size" type="range" min="0.02" max="0.6" step="0.01" value="0.15"><output id="sizeOut"></output></label>
        <label class="slider">Dekking <input id="opacity" type="range" min="0.05" max="1" step="0.05" value="1"><output id="opacityOut"></output></label>
        <label class="slider">Flow <input id="flow" type="range" min="0.05" max="1" step="0.05" value="0.4"><output id="flowOut"></output></label>
        <label class="slider">Hardheid <input id="hardness" type="range" min="0" max="1" step="0.05" value="0.3"><output id="hardnessOut"></output></label>
        <div class="row buttons">
          <button id="undo" type="button" title="Ctrl+Z">Ongedaan</button>
          <button id="fill" type="button">Alles vullen</button>
          <button id="clear" type="button">Alles wissen</button>
        </div>
      </div>
      <p id="saveState" class="muted"></p>
    </section>

    <section class="display">
      <label>Kleur
        <select id="colorMode">
          <option value="start">Verplaatsing t.o.v. begin</option>
          <option value="prev">Verplaatsing t.o.v. vorige cyclus</option>
          <option value="allowed">Verf: toegestaan</option>
          <option value="effective">Toegestaan, effectief (na omrekening)</option>
          <option value="priority">Verf: voorkeur</option>
          <option value="none">Geen</option>
        </select>
      </label>
      <label class="check"><input id="ghost" type="checkbox" checked> Beginvorm tonen</label>
      <label class="check"><input id="wire" type="checkbox"> Mesh-lijnen</label>
      <div id="colorbar" aria-label="Kleurschaal">
        <div class="bar"></div>
        <div class="ticks"><span id="cbMin"></span><span id="cbMid">0</span><span id="cbMax"></span></div>
        <div class="ticks muted"><span id="cbLeft">naar binnen</span><span id="cbRight">naar buiten</span></div>
      </div>
    </section>

    <section id="charts"></section>

    <details>
      <summary>Tabel</summary>
      <table id="table"></table>
    </details>
  </aside>
  <div id="tooltip" role="tooltip" hidden></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
